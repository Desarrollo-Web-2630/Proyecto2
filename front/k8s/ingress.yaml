# Unica entrada: /api y Swagger van al backend, todo lo demas al frontend.
# Sin host: responde por la IP de la VM. Para usar un dominio, agregar 'host:' a la regla.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: procesos
spec:
  ingressClassName: public
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: procesos-backend
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: procesos-backend
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: procesos-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: procesos-frontend
                port:
                  number: 80
