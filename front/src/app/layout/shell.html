<header class="barra">
  <a class="marca" routerLink="/procesos">Procesos</a>
  <nav>
    <a routerLink="/procesos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Mis procesos</a>
    <a routerLink="/procesos/compartidos" routerLinkActive="activo">Compartidos conmigo</a>
    <a routerLink="/usuarios" routerLinkActive="activo">Usuarios</a>
    @if (sesion.esAdmin()) {
      <a routerLink="/configuracion/permisos-pool" routerLinkActive="activo">Permisos de pools</a>
    }
  </nav>
  @if (sesion.usuario(); as u) {
    <div class="usuario">
      <span>{{ u.nombre }}</span>
      <span class="chip">{{ etiquetaRol[u.rolAcceso] }}</span>
      <button type="button" class="btn btn-sec" (click)="salir()">Cerrar sesión</button>
    </div>
  }
</header>
<main class="contenido">
  <router-outlet />
</main>
