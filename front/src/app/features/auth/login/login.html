<div class="pagina-centrada">
  <section class="tarjeta">
    <h1>Iniciar sesión</h1>
    @if (error(); as msg) {
      <div class="alerta alerta-error" role="alert">{{ msg }}</div>
    }
    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>
      <div class="campo">
        <label for="correo">Correo</label>
        <input id="correo" type="email" formControlName="correo" autocomplete="username"
               [class.invalido]="mostrarError(form.controls.correo)" />
        @if (mostrarError(form.controls.correo)) {
          <span class="error-campo">Ingresa un correo válido.</span>
        }
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password"
               [class.invalido]="mostrarError(form.controls.password)" />
        @if (mostrarError(form.controls.password)) {
          <span class="error-campo">La contraseña es obligatoria.</span>
        }
      </div>
      <div class="acciones">
        <button class="btn" type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Entrando...' : 'Entrar' }}
        </button>
        <a routerLink="/registro">Registrar mi empresa</a>
      </div>
    </form>
  </section>
</div>
