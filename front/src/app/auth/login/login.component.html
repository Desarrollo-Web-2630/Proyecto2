<main>
  <h2>Iniciar sesión</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      Correo
      <input type="email" formControlName="correo" autocomplete="username">
    </label>
    <app-field-error
      [control]="form.controls.correo"
      [messages]="{ required: 'El correo es obligatorio', email: 'El correo no tiene un formato válido' }" />

    <label>
      Contraseña
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>
    <app-field-error
      [control]="form.controls.password"
      [messages]="{ required: 'La contraseña es obligatoria' }" />

    @if (message()) {
      <p class="error" role="alert">{{ message() }}</p>
    }

    <div class="acciones">
      <button type="submit" [disabled]="saving()">
        {{ saving() ? 'Entrando…' : 'Entrar' }}
      </button>
      <a routerLink="/registro">Registrar mi empresa</a>
    </div>
  </form>
</main>
