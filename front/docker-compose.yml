# BACKEND_PATH es la carpeta del backend (con su propio Dockerfile)
services:
  backend:
    build: ${BACKEND_PATH:-../Proyecto1/thymeleaf}
    environment:
      SPRING_PROFILES_ACTIVE: h2
      APP_MAIL_ENABLED: "false"
    ports:
      - "8080:8080"

  frontend:
    build: .
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:80"
    depends_on:
      - backend
